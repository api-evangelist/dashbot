method: searched
source: >-
  https://www.dimensionlabs.io/pricing (published certification badges and the
  tier comparison table), https://www.dimensionlabs.io/terms-of-service-policy
  (section 5.2 Security), https://www.dimensionlabs.io/ (homepage compliance
  strip), plus openapi/dashbot-export-api-openapi.yml and live probes on
