name: Dashbot
description: >-
  Dashbot is a conversational-data analytics platform (now operating as Dimension
  Labs) that ingests chatbot, voice-assistant, live-chat, call, survey and other
  unstructured customer conversations and enriches them into structured
  "dimensions" for causal intelligence and reporting. Data is sent in through a
  Universal REST tracker and dozens of one-click integrations (Twilio, Slack,
  Intercom, Zendesk, Salesforce, Amazon Lex/Connect, Google Dialogflow, Genesys,
  Cognigy, Kore.ai, Rasa, and more), then explored through dashboards, data
  explorer, flows and an analytics Agent. A REST Export API (api.dimensionlabs.io)
  and first-party JavaScript, Python and Ruby SDKs let teams pull enriched data
  back out programmatically. Dashbot was surfaced as a portfolio company of
  bessemer-venture-partners; the company rebranded to Dimension Labs while the
  API and SDKs retain the Dashbot name (api.dashbot.io still responds).
