apis:
- aid: dashbot:dashbot-export-api
  name: Dashbot Export API
  description: >-
    Read API for enriched conversational data. GET /export returns a zipFile
    handle for all dimension data across a set of bot IDs over a date range,
    optionally filtered to named prompts; GET /index is the entry point that
    lists the endpoints available to the key. Authenticated with an API key in
    the Authorization header. 2 operations.
  humanURL: https://docs.dimensionlabs.io/reference/using-the-integration-guides
  baseURL: https://api.dimensionlabs.io
  tags:
  - Export
