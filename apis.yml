- aid: dashbot:dashbot-universal-tracker-api
  name: Dashbot Universal Tracker API
  description: >-
    Write/ingest API for unstructured customer conversations. POST one message
    object per call to /track (realtime, timestamp within 24 hours) or
    /trackhistorical (older data), with platform, version, direction and the
    integration source's apiKey supplied as query parameters. The message
    format — text, userId, incoming, conversationId, sessionId and
    dimensionlabs_timestamp plus optional intent/metadata — is documented in
    prose; Dimension Labs publishes NO machine-readable spec for this surface.
  humanURL: https://docs.dimensionlabs.io/reference/rest-api
  baseURL: https://tracker.dimensionlabs.io
  tags:
  - Ingest
  - Tracking
  properties:
  - type: Documentation
    url: https://docs.dimensionlabs.io/reference/rest-api
  - type: Authentication
    url: authentication/dashbot-authentication.yml
  - type: Conventions
    url: conventions/dashbot-conventions.yml
  - type: DataModel
    url: data-model/dashbot-data-model.yml
  - type: ErrorCatalog
    url: errors/dashbot-problem-types.yml
  - type: RateLimits
    url: rate-limits/dashbot-rate-limits.yml
  x-no-spec: >-
    No OpenAPI, AsyncAPI, GraphQL SDL or Postman collection is published for the
    tracker. Probed 2026-08-14: /openapi.json, /openapi.yaml, /swagger.json,
    /api-docs and /docs all 404 on tracker.dimensionlabs.io.
- aid: dashbot:dashbot-mcp
  name: Dimension Labs Documentation MCP
  description: >-
    Model Context Protocol endpoint served from the Dimension Labs
    documentation host. Answers JSON-RPC 2.0; tools/list is authorization-gated
    for anonymous clients, so the tool set is not publicly enumerable.
